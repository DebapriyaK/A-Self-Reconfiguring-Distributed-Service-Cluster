services:
  monitor:
    build: .
    command: python monitor.py
    ports:
      - "5005:5005/udp"
    restart: unless-stopped

  node1:
    build: .
    environment:
      - MONITOR_HOST=monitor
    depends_on:
      - monitor
    restart: unless-stopped

  node2:
    build: .
    environment:
      - MONITOR_HOST=monitor
    depends_on:
      - monitor
    restart: unless-stopped

  node3:
    build: .
    environment:
      - MONITOR_HOST=monitor
    depends_on:
      - monitor
    restart: unless-stopped

  # Optional chaos node: fails after a short time to prove self-reconfiguration.
  node_chaos:
    build: .
    environment:
      - MONITOR_HOST=monitor
      - CRASH_AFTER_SECONDS=18
    depends_on:
      - monitor
